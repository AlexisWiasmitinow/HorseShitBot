battery_modbus_node:
  ros__parameters:
    # Verified N43IC04 configuration. IDs 1-6 are reserved for motors.
    slave_id: 33
    channel: 1
    read_period_sec: 1.0
    request_timeout_sec: 0.2

    # Measured on the robot on 2026-09-25 and cross-checked against the
    # discharge logger, which used (raw + 15.2) / 49.25:
    #   raw  970 -> 20.0 V     raw 1265 -> 26.0 V
    #   raw 1068 -> 22.0 V     raw 1364 -> 28.0 V
    #   raw 1167 -> 24.0 V
    # The empirical fit folds the ADC scaling and the external divider into a
    # single affine map, so voltage_divider_factor stays at 1.0 rather than
    # describing the divider separately. The previous raw/50 placeholder read
    # roughly 0.6-0.7 V low across the whole range.
    channel_base_register: 0
    raw_scale: 49.25
    voltage_divider_factor: 1.0
    voltage_offset: 0.30862944
    voltage_multiplier: 1.0

    # Placeholder thresholds for the current 24 V-class battery. These are
    # evaluated against the instantaneous calibrated voltage, never against
    # the smoothed value or the displayed percentage.
    low_voltage: 22.0
    critical_voltage: 21.0
    critical_confirmations: 3

    # Empirical state-of-charge curve from the 2026-09-25 discharge test: one
    # 21.4 h run to the BMS cutoff, voltage only, no coulomb counting. The
    # curve is very flat in its middle, so the displayed percentage is
    # indicative and will drift with load, temperature and battery ageing.
    # Both arrays must be the same length, at least two entries, ordered by
    # voltage and non-rising in percentage; invalid values fall back to the
    # built-in defaults in drivers/modbus_adc.py.
    soc_voltage_points: [26.40, 26.20, 26.05, 25.95, 25.85, 25.70, 25.55,
                         25.40, 25.20, 24.80, 24.00, 23.00, 22.00, 20.00]
    soc_percent_points: [100.0, 70.8, 52.1, 39.8, 32.2, 24.4, 20.2,
                         15.5, 7.9, 5.3, 3.0, 1.5, 0.6, 0.0]

    # Median window applied before the SoC lookup only. At read_period_sec
    # 1.0 this is a 30 s window, which covers the ~2-count ADC noise that
    # would otherwise swing the percentage by several points in the plateau.
    soc_median_window: 30

    # Acquisition/status only. OS shutdown is intentionally not implemented.
    shutdown_enabled: false
