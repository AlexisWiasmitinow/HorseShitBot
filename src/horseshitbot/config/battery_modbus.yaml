battery_modbus_node:
  ros__parameters:
    # Verified N43IC04 configuration. IDs 1-6 are reserved for motors.
    slave_id: 33
    channel: 1
    read_period_sec: 1.0
    request_timeout_sec: 0.2
    channel_base_register: 0

    # Divider calibration measured on the robot (2026-09-25):
    #   20 V -> 970   22 V -> 1068   24 V -> 1167   26 V -> 1265   28 V -> 1364
    # battery_voltage = (raw + raw_offset_counts) / counts_per_volt
    raw_offset_counts: 15.2
    counts_per_volt: 49.25

    # 24 V-class pack: warn at 22 V, treat 20 V as end of discharge.
    low_voltage: 22.0
    critical_voltage: 20.0
    # Voltage must stay at or below critical_voltage for this long before the
    # shutdown sequence runs. Sag under motor load must not trigger it.
    critical_hold_sec: 5.0

    # On a confirmed critical battery: run the safe motor-stop path, then
    # power the Jetson down. The sequence is latched and runs at most once.
    shutdown_enabled: true
    safe_stop_services:
      - "/wheel_driver_node/stop_fast"
      - "/lift/stop"
      - "/brush/stop"
      - "/bin_door/stop"
    # Time allowed for stop acknowledgements, and again for the stop frames to
    # reach the motors before the shutdown command is issued.
    safe_stop_grace_sec: 3.0
    # Absolute path so the /etc/sudoers.d/horseshitbot-shutdown rule matches a
    # fixed command rather than whatever PATH resolves to. See the README.
    shutdown_command: ["sudo", "-n", "/usr/sbin/shutdown", "-h", "now"]

    # Displayed state of charge only. Derived from the 2026-09-25 discharge
    # test: one 21.4 h run to the BMS cutoff, voltage only, no coulomb
    # counting, so the percentage assumes a comparable load and will drift
    # with load, temperature, ageing and battery-to-battery variation.
    # Both arrays must be the same length, at least two entries, ordered by
    # voltage and non-rising in percentage; invalid values fall back to the
    # built-in defaults in drivers/modbus_adc.py.
    soc_voltage_points: [26.40, 26.20, 26.05, 25.95, 25.85, 25.70, 25.55,
                         25.40, 25.20, 24.80, 24.00, 23.00, 22.00, 20.00]
    soc_percent_points: [100.0, 70.8, 52.1, 39.8, 32.2, 24.4, 20.2,
                         15.5, 7.9, 5.3, 3.0, 1.5, 0.6, 0.0]

    # Median window applied before the SoC lookup, and nowhere else. At
    # read_period_sec 1.0 this is a 30 s window, which absorbs the ~2-count
    # ADC noise that would otherwise swing the displayed percentage by
    # several points. The low/critical/shutdown path keeps using the
    # instantaneous calibrated voltage.
    soc_median_window: 30
