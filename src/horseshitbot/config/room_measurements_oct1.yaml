# Ground-Truth Physical Room Measurements — October 1, 2026 Recording Session
#
# Transcribed from handwritten physical room measurements for the room recorded in
# `mapping_2026-10-01_14-36-31`.
#
# IMPORTANT GEOMETRY NOTES:
# 1. All confirmed dimensions below are provisionally interpreted in METERS (`m`).
# 2. The room is long and narrow with a straight left wall (`L1 = 10.600 m`) and a
#    stepped right-hand wall with three width sections (`W1`, `W2`, `W3`) and three
#    longitudinal right-wall sections (`R1`, `R2`, `R3`).
# 3. Longitudinal discrepancy (preserved, NOT auto-corrected):
#      R1 + R2 + R3 = 4.750 + 4.400 + 1.172 = 10.322 m
#      L1 - (R1 + R2 + R3) = 10.600 - 10.322 = +0.278 m
#    Because of this 0.278 m longitudinal gap, the floor-plan polygon is not closed
#    along the vertical/longitudinal axis unless the missing 0.278 m is explicitly
#    left open as an unresolved longitudinal interval.
# 4. Unassigned / uncertain sketch annotations (`0.7 m` circled and `327.3` with
#    unclear units/correspondence) are stored separately under
#    `unassigned_or_uncertain_measurements` and are NOT incorporated into the room
#    polygon geometry.

room_metadata:
  recording_date: "2026-10-01"
  primary_bag: "/home/hsb/rosbags/mapping_2026-10-01_14-36-31"
  slam_map_yaml: "/home/hsb/hsb_analysis/lidar_validation/slam_toolbox/corrected_icp_odom/oct1_corrected_icp_odom.yaml"
  units: "meters"
  provisional_units: true
  coordinate_convention:
    origin_description: "Lower-left corner of left wall L1 at (x=0.0 m, y=0.0 m)"
    x_axis: "Horizontal room width from left wall L1 (x=0) toward stepped right wall (+X)"
    y_axis: "Longitudinal axis along left wall L1 from lower end (y=0) to upper end (y=10.600 m)"
    right_wall_vertical_anchor_note: >
      Right-wall sections R1 (upper, 4.750 m), R2 (middle, 4.400 m), and R3 (lower, 1.172 m)
      sum to 10.322 m against L1 = 10.600 m. By default the reference layout anchors R1 at the
      upper boundary y = 10.600 m and leaves the unresolved 0.278 m longitudinal discrepancy
      explicitly highlighted at y = [0.000, 0.278] m rather than stretching any measured section.

discrepancies:
