    severity: "warning"
    left_wall_id: "L1"
    left_wall_length_m: 10.600
    right_wall_section_ids: ["R1", "R2", "R3"]
    right_wall_sum_m: 10.322
    difference_m: 0.278
    signed_right_minus_left_m: -0.278
    percentage_of_left_wall: -2.6226
    explanation: >
      Right-hand wall sections R1 (4.750 m) + R2 (4.400 m) + R3 (1.172 m) total 10.322 m,
      which is 0.278 m shorter than the recorded overall left wall length L1 (10.600 m).
      This discrepancy is preserved without modification and flagged in the visualization.

